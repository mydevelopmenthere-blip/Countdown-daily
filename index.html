<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Countdown</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{text-align:center}
#label{font-size:14px;letter-spacing:2px;color:#777;margin-bottom:8px}
#timer{font-variant-numeric:tabular-nums;font-size:clamp(38px,10vw,72px);font-weight:600;color:#111;letter-spacing:1px}
#sub{font-size:12px;color:#999;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
  <div id="label">TIME LEFT TODAY</div>
  <div id="timer">00:00:00</div>
  <div id="sub">until midnight</div>
</div>
<script>
function update(){
  const now=new Date();
  const end=new Date(now);
  end.setHours(24,0,0,0);
  let s=Math.max(0,Math.floor((end-now)/1000));
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60); const sec=s%60;
  document.getElementById('timer').textContent =
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
update();
setInterval(update,250);
</script>
</body>
</html>
